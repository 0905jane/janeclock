<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktop Beaker Clock</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="clock-stage" aria-label="Actual time beaker clock">
      <section class="date-tag" aria-label="Today's date">
        <span id="dateLabel">2026년 6월 8일</span>
      </section>

      <section class="beaker beaker-hour" aria-label="Hours, twenty four hour scale">
        <div class="liquid liquid-hour" id="hourLiquid" aria-hidden="true"></div>
        <div class="scale-labels" id="hourScale" aria-hidden="true"></div>
      </section>

      <section class="beaker beaker-minute" aria-label="Minutes">
        <div class="liquid liquid-minute" id="minuteLiquid" aria-hidden="true"></div>
        <div class="scale-labels" id="minuteScale" aria-hidden="true"></div>
      </section>

      <section class="beaker beaker-second" aria-label="Seconds">
        <div class="liquid liquid-second" id="secondLiquid" aria-hidden="true"></div>
        <div class="scale-labels" id="secondScale" aria-hidden="true"></div>
      </section>

      <output class="sr-only" id="timeAnnouncer" aria-live="polite"></output>
    </main>

    <script src="./clock.js"></script>
  </body>
</html>
